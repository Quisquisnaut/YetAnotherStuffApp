name: Windows release

# Tests the app on Windows and builds the Windows zip.
# Push a tag like "v0.3.0" to publish the zip as a GitHub release.
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Build the zip
        run: python tools/make_release.py
      - name: Start the unzipped app with the launcher
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item dist\*.zip).FullName -DestinationPath "$env:RUNNER_TEMP\try"
          Set-Location "$env:RUNNER_TEMP\try\YetAnotherStuffApp"
          "0" | & ".\Start Stuff App.bat"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path StuffData)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.3.0
        with:
          name: windows-zip
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "YetAnotherStuffApp $GITHUB_REF_NAME" --notes-file packaging/windows/WINDOWS-SETUP.txt
