name: Windows release

# Tests on desktop platforms and preserves Step 00 packages and smoke evidence.
# Only an explicitly pushed version tag publishes a release.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        timeout-minutes: 5
        run: python -m unittest discover -s tests -t .
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import os; from stuffapp import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__, 'Tag and app version differ'"
      - name: Build versioned packages
        timeout-minutes: 2
        run: python tools/make_release.py --platform all --kind ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'test' }}
      - name: Console smoke tests of extracted packages (--console)
        timeout-minutes: 3
        run: python tools/smoke_release.py dist/*.zip --timeout 30 --report dist/console-smoke.json
      - name: Windows launcher console smoke test (--console)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python tools/smoke_release.py dist/*-windows.zip --launcher --timeout 30 --report dist/launcher-smoke.json
      - name: Windows GUI smoke test (automatic shutdown)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python tools/smoke_release.py dist/*-windows.zip --gui --timeout 30 --report dist/gui-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step-00-${{ runner.os }}-packages
          path: |
            dist/*.zip
            dist/*-smoke.json
          retention-days: 14
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.3.0
        with:
          name: step-00-Windows-packages
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "YetAnotherStuffApp $GITHUB_REF_NAME" --notes-file packaging/windows/WINDOWS-SETUP.txt
